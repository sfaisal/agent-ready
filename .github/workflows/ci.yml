name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Test
        run: pytest --cov=agent_ready --cov-report=term-missing

      - name: Verify generated MCP scaffold speaks the protocol
        run: |
          # Fail loudly if no usable MCP server class is present — otherwise the
          # conformance tests skip silently and CI goes green on nothing.
          # The class moved in mcp 2.0, so accept either generation.
          python - <<'PY'
          try:
              from mcp.server import MCPServer as S
          except ImportError:
              from mcp.server.fastmcp import FastMCP as S
          print("MCP server class available:", S.__name__)
          PY
          agent-ready examples/agent_ready_booking_api.yaml --generate-mcp /tmp/server.py --quiet
          python /tmp/server.py < /dev/null || true
          # Defence in depth: a skipped conformance suite is a silent pass, which
          # is the exact failure this step exists to prevent.
          pytest tests/test_mcp_conformance.py -v -rs | tee /tmp/conformance.log
          if grep -q "SKIPPED" /tmp/conformance.log; then
            echo "::error::Conformance tests were skipped, not run — treating as failure."
            exit 1
          fi

      - name: Smoke-test the CLI
        run: |
          agent-ready examples/sample_booking_api.yaml
          agent-ready examples/sample_booking_api.yaml --format json > /dev/null
          agent-ready examples/sample_booking_api.yaml --format markdown --out /tmp/report.md

      - name: Verify CI gate exit codes
        run: |
          # Should fail: the sample spec is deliberately flawed
          if agent-ready examples/sample_booking_api.yaml --min-score 95 --quiet; then
            echo "FAIL: gate should have rejected a low score"; exit 1
          fi
          # Should pass
          agent-ready examples/sample_booking_api.yaml --min-score 10 --quiet
