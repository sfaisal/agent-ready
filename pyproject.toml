[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openapi-agent-ready"
version = "0.3.0"
description = "Audit any OpenAPI spec for AI-agent and MCP readiness, and generate an MCP server scaffold."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Shah Faisal Darwaish" }]
keywords = ["openapi", "mcp", "ai-agents", "api-design", "model-context-protocol", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
# Dependencies the *generated* server needs at runtime — not needed to run the
# auditor or to generate a scaffold, only to execute one. The scaffold supports
# both SDK generations: FastMCP (1.x) and MCPServer (2.x).
server = ["mcp>=1.0", "httpx>=0.27"]
# Retained as an alias; `server` describes what it does more accurately.
mcp = ["mcp>=1.0", "httpx>=0.27"]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "pytest-asyncio>=0.23", "ruff>=0.4",
       "jsonschema>=4.0", "mcp>=1.0", "httpx>=0.27"]

[project.scripts]
agent-ready = "agent_ready.cli:main"

[project.urls]
Homepage = "https://github.com/sfaisal/agent-ready"
Issues = "https://github.com/sfaisal/agent-ready/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_ready"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"
